name: Desktop build

# Prepared locally. Publishing and dispatching this workflow require separate approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
            platform: windows/amd64
            tags: ""
            extra: "-webview2 error"
          - target: macos-amd64
            runner: macos-15-intel
            platform: darwin/amd64
            tags: ""
            extra: ""
          - target: macos-arm64
            runner: macos-15
            platform: darwin/arm64
            tags: ""
            extra: ""
          - target: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            extra: "-tags webkit2_41"
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.3"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Set macOS deployment minimum
        if: runner.os == 'macOS'
        run: |
          echo "CGO_CFLAGS=-mmacosx-version-min=12.0" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-mmacosx-version-min=12.0" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Test and vet Go
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go test -tags "$BUILD_TAGS" ./...
          go vet -tags "$BUILD_TAGS" ./...
      - name: Build desktop application
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_EXTRA: ${{ matrix.extra }}
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 build -platform "$BUILD_PLATFORM" -trimpath $BUILD_EXTRA
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/xkeen-installer.exe -DestinationPath build/bin/xkeen-installer-windows-amd64.zip
      - name: Archive macOS application
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/xkeen-installer.app "build/bin/xkeen-installer-$BUILD_TARGET.zip"
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -C build/bin -czf build/bin/xkeen-installer-linux-amd64.tar.gz xkeen-installer
      - name: Upload build archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xkeen-installer-${{ matrix.target }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
          if-no-files-found: error
          retention-days: 7
