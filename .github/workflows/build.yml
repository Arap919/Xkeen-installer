name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so each successful run receives a unique patch version.
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Select release version
        shell: python
        run: |
          import json, os, re, subprocess
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          current = subprocess.check_output(['git', 'tag', '--points-at', 'HEAD'], text=True).splitlines()
          def semver(tag):
              match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag)
              return tuple(map(int, match.groups())) if match else None
          existing = [semver(t) for t in current if semver(t)]
          versions = [semver(t) for t in tags if semver(t)]
          if existing:
              version = max(existing)
          elif versions:
              major, minor, patch = max(versions)
              version = (major, minor, patch + 1)
          else:
              version = tuple(map(int, json.load(open('wails.json'))['info']['productVersion'].split('.')))
          value = '.'.join(map(str, version))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={value}\ntag=v{value}\n')

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
            platform: windows/amd64
            tags: "wv2runtime.error"
            extra: "-webview2 error -nsis"
          - target: macos-amd64
            runner: macos-15-intel
            platform: darwin/amd64
            tags: "wv2runtime.download"
            extra: ""
          - target: macos-arm64
            runner: macos-15
            platform: darwin/arm64
            tags: "wv2runtime.download"
            extra: ""
          - target: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tags: "webkit2_41,wv2runtime.download"
            extra: "-tags webkit2_41"
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.11"
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Set macOS deployment minimum
        if: runner.os == 'macOS'
        run: |
          echo "CGO_CFLAGS=-mmacosx-version-min=12.0" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-mmacosx-version-min=12.0" >> "$GITHUB_ENV"
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set application version
        shell: python
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          import json, os
          from pathlib import Path
          path = Path('wails.json')
          config = json.loads(path.read_text())
          config['info']['productVersion'] = os.environ['RELEASE_VERSION']
          path.write_text(json.dumps(config, indent=2) + '\n')
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Test and vet Go
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go test -tags "$BUILD_TAGS" ./...
          go vet -tags "$BUILD_TAGS" ./...
      - name: Scan production source for vulnerabilities
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags "desktop,production,$BUILD_TAGS" ./...
      - name: Build desktop application
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_EXTRA: ${{ matrix.extra }}
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 build -platform "$BUILD_PLATFORM" -trimpath $BUILD_EXTRA
      - name: Verify and scan built Go executable
        shell: python
        run: |
          import pathlib, subprocess
          candidates = []
          for path in pathlib.Path('build/bin').rglob('*'):
              if not path.is_file():
                  continue
              result = subprocess.run(['go', 'version', '-m', str(path)], capture_output=True, text=True)
              if result.returncode == 0 and '\tpath\tgithub.com/Arap919/xkeen-installer\n' in result.stdout:
                  candidates.append((path, result.stdout))
          if len(candidates) != 1:
              raise SystemExit(f'Expected one application Go executable, found {len(candidates)}')
          path, metadata = candidates[0]
          print(metadata)
          expected = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip()
          if not metadata.splitlines()[0].endswith(': ' + expected):
              raise SystemExit('Built executable does not use the configured Go toolchain')
          subprocess.run(['go', 'run', 'golang.org/x/vuln/cmd/govulncheck@v1.9.0', '-mode=binary', str(path)], check=True)
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release
          $installers = @(Get-ChildItem build/bin/xkeen-installer-amd64-installer.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName "release/xkeen-installer-$env:RELEASE_VERSION-windows-amd64-setup.exe"
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release build/dmg
          ditto build/bin/xkeen-installer.app build/dmg/xkeen-installer.app
          ln -s /Applications build/dmg/Applications
          DMG_SIZE_MIB=$(python3 -c 'from pathlib import Path; total=sum(p.stat().st_size for p in Path("build/dmg").rglob("*") if not p.is_symlink() and p.is_file()); print((total+1048575)//1048576+64)')
          echo "DMG filesystem capacity: ${DMG_SIZE_MIB} MiB (logical files plus 64 MiB headroom)"
          df -h build/dmg
          hdiutil create -volname "XKeen Installer" -srcfolder build/dmg -size "${DMG_SIZE_MIB}m" -ov -format UDZO "release/xkeen-installer-$RELEASE_VERSION-$BUILD_TARGET.dmg"
      - name: Package Linux Debian installer
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash build/linux/package.sh "$RELEASE_VERSION"
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xkeen-installer-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: xkeen-installer-*
          path: release
          merge-multiple: true
      - name: Prepare final release checksums
        id: prepare-release
        shell: python
        run: |
          import hashlib, os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Invalid release tag")
          version = tag[1:]
          root = pathlib.Path("release")
          expected = {f"xkeen-installer-{version}-{suffix}" for suffix in (
              "windows-amd64-setup.exe", "linux-amd64.deb",
              "macos-amd64.dmg", "macos-arm64.dmg")}
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("Invalid release directory")
          files = list(root.iterdir())
          if {p.name for p in files} != expected:
              raise SystemExit("Expected exactly the four final installers")
          if any(p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit("Release payload must contain regular files only")
          lines = []
          for path in sorted(files):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1 << 20), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {path.name}\n")
          with (root / "SHA256SUMS").open("x", encoding="ascii", newline="\n") as output:
              output.writelines(lines)
      - name: Attest final release bytes
        id: attest-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
          create-storage-record: false
      - name: Verify final release provenance
        id: verify-release
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/heads/main"
          for artifact in release/*; do
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
                --cert-identity "$identity" --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners; then
                verified=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            test "$verified" = true
          done
      - name: Publish tag and release
        id: publish-release
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$state" = false ]; then
              test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 5
              echo "Release already published; preserving existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "XKeen Installer $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 5
          gh release edit "$RELEASE_TAG" --draft=false --latest
