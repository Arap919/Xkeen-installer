mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: %s
proxy-providers:
  subscription:
    type: http
    url: %s
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: PROXY
    type: select
    use: [subscription]
  - name: BENCHMARK
    type: select
    use: [subscription]
    hidden: true
listeners:
  - name: benchmark-in
    type: http
    listen: 127.0.0.1
    port: 17890
    proxy: BENCHMARK
    users: []
  - name: transparent-in
    type: tproxy
    listen: 0.0.0.0
    port: 50080
    udp: true
rules:
  - MATCH,PROXY
